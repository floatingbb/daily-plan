  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日事件工作台</title>

  <style>
    :root {
      --theme-primary: #e88ea8;
      --theme-secondary: #cbbff0;
      --theme-background: #fffaf7;
      --theme-light: #fff0f4;

      --text: #3e4656;
      --title: #5c5874;
      --muted: #9099a8;
      --line: #eee6e2;

      --green-light: #e3f7e9;

      --shadow: 0 12px 32px rgba(142, 122, 117, 0.12);
      --small-shadow: 0 5px 16px rgba(142, 122, 117, 0.1);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          circle at top left,
          rgba(232, 142, 168, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(203, 191, 240, 0.2),
          transparent 32%
        ),
        var(--theme-background);
      font-family:
        Inter,
        "PingFang SC",
        "Microsoft YaHei",
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .app {
      min-height: 100vh;
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      max-width: 1650px;
      margin: 0 auto 20px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--theme-primary);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      color: var(--title);
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
    }

    .subtitle {
      max-width: 850px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(430px, 0.92fr);
      gap: 20px;
      max-width: 1650px;
      height: calc(100vh - 150px);
      min-height: 700px;
      margin: 0 auto;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.93);
      box-shadow: var(--shadow);
    }

    .date-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 22px;
    }

    .event-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      padding: 22px;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 17px;
    }

    .panel-title {
      margin: 0;
      color: var(--title);
      font-size: 18px;
    }

    .panel-description {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .schedule-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .current-month-label {
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--theme-primary);
      background: var(--theme-light);
      font-size: 13px;
      font-weight: 900;
    }

    .primary-button,
    .secondary-button,
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 13px;
      transition: 0.2s ease;
    }

    .primary-button {
      padding: 11px 16px;
      border: 0;
      color: white;
      background: linear-gradient(
        135deg,
        var(--theme-primary),
        var(--theme-secondary)
      );
      box-shadow: 0 8px 18px rgba(170, 115, 145, 0.26);
      font-weight: 850;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(170, 115, 145, 0.32);
    }

    .secondary-button {
      padding: 10px 14px;
      border: 1px solid var(--line);
      color: #70798a;
      background: white;
      font-weight: 800;
    }

    .secondary-button:hover {
      border-color: var(--theme-primary);
      color: var(--theme-primary);
      background: var(--theme-light);
    }

    .icon-button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--line);
      color: #8f96a3;
      background: white;
      font-size: 14px;
    }

    .icon-button:hover {
      border-color: var(--theme-primary);
      color: var(--theme-primary);
      background: var(--theme-light);
    }

    .icon-button.delete:hover {
      border-color: #efb4b4;
      color: #c86c6c;
      background: #fff2f2;
    }

    .date-stream {
      flex: 1;
      min-height: 0;
      padding: 2px 10px 40px 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: var(--theme-primary) #f8f3f1;
      scrollbar-width: thin;
    }

    .date-stream::-webkit-scrollbar {
      width: 8px;
    }

    .date-stream::-webkit-scrollbar-track {
      border-radius: 99px;
      background: #f8f3f1;
    }

    .date-stream::-webkit-scrollbar-thumb {
      border-radius: 99px;
      background: var(--theme-primary);
    }

    .day-card {
      position: relative;
      margin-bottom: 16px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      transition: 0.2s ease;
    }

    .day-card:hover {
      border-color: rgba(232, 142, 168, 0.4);
      box-shadow: var(--small-shadow);
    }

    .day-card.today {
      border-color: rgba(232, 142, 168, 0.8);
      box-shadow:
        0 0 0 4px var(--theme-light),
        var(--small-shadow);
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 13px;
    }

    .day-main-label {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 11px;
    }

    .day-number {
      color: var(--title);
      font-size: 28px;
      font-weight: 950;
    }

    .day-weekday {
      color: var(--theme-primary);
      font-size: 13px;
      font-weight: 900;
    }

    .today-badge {
      padding: 5px 9px;
      border-radius: 999px;
      color: #a45e77;
      background: var(--theme-light);
      font-size: 11px;
      font-weight: 900;
    }

    .day-summary {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .day-events {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drop-slot {
      min-height: 63px;
      padding: 5px;
      border: 1px dashed transparent;
      border-radius: 15px;
      transition: 0.18s ease;
    }

    .drop-slot.drag-over {
      border-color: var(--theme-primary);
      background: var(--theme-light);
    }

    .empty-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      border: 1px dashed #e7deda;
      border-radius: 12px;
      color: #b1a9a7;
      background: #fffdfc;
      font-size: 12px;
    }

    .event-card {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px;
      border: 1px solid #e5dfdc;
      border-left: 5px solid var(--event-color, #ffffff);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 3px 11px rgba(139, 122, 120, 0.08);
      cursor: grab;
      transition: 0.18s ease;
    }

    .event-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--small-shadow);
    }

    .event-card:active {
      cursor: grabbing;
    }

    .event-card.dragging {
      opacity: 0.45;
    }

    .event-card.completed {
      opacity: 0.7;
      background: #fcfbfb;
    }

    .event-card.completed .event-title {
      color: #9ba1aa;
      text-decoration: line-through;
    }

    .event-check {
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      margin-top: 2px;
      accent-color: var(--theme-primary);
      cursor: pointer;
    }

    .event-info {
      flex: 1;
      min-width: 0;
    }

    .event-title {
      margin: 0;
      color: #5b5870;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }



    .event-notes {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .event-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      color: #777f91;
      background: #f1f1f7;
      font-size: 10px;
      font-weight: 850;
    }

    .event-tag.done {
      color: #55936d;
      background: var(--green-light);
    }

    .event-tag.alert {
      color: #c85d68;
      background: #ffe7e9;
    }

    .event-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 5px;
    }

    .event-actions .icon-button {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      font-size: 12px;
    }

    .inbox-list {
      flex: 1;
      min-height: 260px;
      padding: 7px;
      overflow-y: auto;
      border: 1px dashed #e5dcda;
      border-radius: 17px;
      background: #fffdfc;
      scrollbar-color: var(--theme-primary) #f8f3f1;
      scrollbar-width: thin;
    }

    .inbox-list.drag-over {
      border-color: var(--theme-primary);
      background: var(--theme-light);
    }

    .inbox-drop-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 45px 18px;
      color: #b1a9a7;
      font-size: 13px;
      text-align: center;
      line-height: 1.8;
    }

    .inbox-list .event-card {
      margin-bottom: 8px;
    }

    .inbox-list .event-card:last-child {
      margin-bottom: 0;
    }

    .event-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-top: 15px;
      padding: 15px;
      border: 1px solid transparent;
      border-top: 1px solid var(--line);
      border-radius: 17px;
      transition: 0.25s ease;
    }

    .event-form.is-highlighted {
      border-color: rgba(232, 142, 168, 0.45);
      background: #fff8fa;
      box-shadow: 0 0 0 6px rgba(232, 142, 168, 0.12);
      animation: form-highlight 0.9s ease;
    }

    @keyframes form-highlight {
      0% {
        box-shadow: 0 0 0 0 rgba(232, 142, 168, 0.4);
      }

      50% {
        box-shadow: 0 0 0 8px rgba(232, 142, 168, 0.18);
      }

      100% {
        box-shadow: 0 0 0 6px rgba(232, 142, 168, 0.12);
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      color: #6d7483;
      font-size: 12px;
      font-weight: 850;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: #5f6675;
      background: #fffdfc;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--theme-primary);
      box-shadow: 0 0 0 4px var(--theme-light);
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    input[type="color"] {
      height: 42px;
      padding: 3px;
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      grid-column: 1 / -1;
      gap: 8px;
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(87, 75, 80, 0.3);
      backdrop-filter: blur(5px);
    }

    .modal-layer.show {
      display: flex;
    }

    .modal {
      width: min(1050px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 25px;
      background: white;
      box-shadow: 0 25px 70px rgba(104, 79, 86, 0.25);
      animation: modal-in 0.2s ease;
    }

    .settings-modal {
      width: min(590px, 100%);
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header,
    .calendar-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .modal-title {
      margin: 0;
      color: var(--title);
      font-size: 20px;
    }

    .close-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 12px;
      color: #7e8491;
      background: #f8f3f1;
      font-size: 20px;
    }

    .close-button:hover {
      color: var(--theme-primary);
      background: var(--theme-light);
    }

    .calendar-month-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .calendar-month-title {
      color: var(--title);
      font-size: 18px;
      font-weight: 900;
    }

    .calendar-navigation {
      display: flex;
      gap: 5px;
    }

    .calendar-navigation .icon-button {
      width: 31px;
      height: 31px;
      border-radius: 9px;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .calendar-weekdays {
      margin-bottom: 6px;
    }

    .calendar-weekday {
      color: #a1a6b0;
      font-size: 11px;
      font-weight: 850;
      text-align: center;
    }

    .calendar-day {
      position: relative;
      min-height: 95px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #697181;
      background: #fffdfc;
      text-align: left;
      transition: 0.18s ease;
    }

    .calendar-day:hover {
      border-color: var(--theme-primary);
      background: var(--theme-light);
    }

    .calendar-day.other-month {
      opacity: 0.35;
    }

    .calendar-day.today {
      border-color: var(--theme-primary);
      background: var(--theme-light);
    }

    .calendar-day-number {
      display: block;
      font-size: 14px;
      font-weight: 900;
    }

    .calendar-counts {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 15px;
      font-size: 11px;
      line-height: 1.25;
    }

    .calendar-counts .all-count {
      color: var(--theme-primary);
      font-weight: 900;
    }

    .calendar-counts .done-count {
      color: #62a179;
    }

    .calendar-counts .todo-count {
      color: #b78558;
    }

    .color-line {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 9px;
      align-items: center;
    }

    .color-value {
      color: #858d9b;
      font-size: 12px;
      text-align: center;
    }

    .confetti {
      position: fixed;
      z-index: 100;
      width: 9px;
      height: 15px;
      pointer-events: none;
      animation: confetti-fall 1.35s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% {
        opacity: 1;
        transform: translate(0, -20px) rotate(0deg);
      }

      100% {
        opacity: 0;
        transform:
          translate(var(--x), var(--y))
          rotate(680deg);
      }
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 0;
      }

      .date-panel {
        min-height: 720px;
      }

      .event-panel {
        min-height: 720px;
      }
    }

    @media (max-width: 760px) {
      .app {
        padding: 14px;
      }

      .topbar {
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .layout {
        display: flex;
        flex-direction: column;
      }

      .event-form {
        grid-template-columns: 1fr;
      }

      .form-group.full,
      .form-actions {
        grid-column: auto;
      }

      .date-panel {
        min-height: 650px;
      }

      .event-panel {
        min-height: 700px;
      }

      .calendar-day {
        min-height: 68px;
        padding: 6px;
      }

      .calendar-counts {
        margin-top: 8px;
        font-size: 9px;
      }
    }

    @media (max-width: 480px) {
      .day-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .event-card {
        padding: 10px;
      }

      .event-actions {
        flex-direction: column;
      }

      .calendar-day {
        min-height: 54px;
      }

      .calendar-counts {
        font-size: 8px;
      }

      .calendar-day-number {
        font-size: 12px;
      }
    }
  
.cloudbar{max-width:1650px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:12px 16px;background:#ffffffc9;border:1px solid var(--line);border-radius:16px;font-size:12px}
.cloudbar button,.cloudbar a,.import-label{border:1px solid var(--line);background:white;color:var(--title);padding:9px 12px;border-radius:10px;text-decoration:none;cursor:pointer}
#accountLabel{overflow:hidden;text-overflow:ellipsis;max-width:250px}#syncStatus{color:#527a64;margin-right:auto}
dialog{width:min(460px,calc(100% - 28px));border:1px solid var(--line);border-radius:20px;padding:26px;color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:#30293b66}dialog p{line-height:1.7}dialog button{margin:4px}
.mobile-order{display:none}button,a,input,select,textarea{touch-action:manipulation}button{min-height:36px}.event-title,.event-notes{overflow-wrap:anywhere}
@media(max-width:760px){
html,body{max-width:100%;overflow-x:hidden}.app{padding:12px 12px max(20px,env(safe-area-inset-bottom))}
h1{font-size:26px}.topbar{gap:12px}.top-actions{width:100%;display:flex}.top-actions button{flex:1;min-height:44px}
.cloudbar{padding:10px;gap:7px}#accountLabel{max-width:calc(100vw - 60px);width:100%}#syncStatus{width:100%}
.layout{gap:14px;min-height:0;height:auto}.date-panel{min-height:0;height:65dvh;padding:14px}.event-panel{min-height:0;height:auto;padding:14px}.date-stream{min-height:0;overscroll-behavior:contain}.inbox-list{max-height:40dvh;min-height:100px}
.panel-header{gap:8px}.panel-title{font-size:17px}.panel-description{font-size:12px}.event-form{margin-top:18px}input,select,textarea{font-size:16px!important;min-width:0}.event-actions{gap:4px}.icon-button{min-width:34px;min-height:36px}.mobile-order{display:inline-flex;align-items:center;justify-content:center}
.modal-layer{padding:10px}.modal{max-height:90dvh;overflow:auto;padding:14px}.calendar-grid{gap:3px}.calendar-day{padding:4px;min-width:0}.calendar-counts{overflow-wrap:anywhere}.settings-grid{grid-template-columns:1fr}

<body>
<div class="app" id="workspaceRoot"><div class="cloudbar"><span class="sync-dot" aria-hidden="true"></span><span id="syncStatus" role="status" aria-live="polite">仅保存在本浏览器 · 不自动同步</span><details class="cloud-menu"><summary aria-label="导入和导出备份">备份 <span aria-hidden="true">⌄</span></summary><div class="cloud-menu-content"><strong>独立 HTML · 本机存储</strong><button id="exportData" type="button">导出备份</button><label class="import-label">导入备份<input id="importData" type="file" accept="application/json,.json" hidden></label></div></details></div>
    <header class="topbar">
      <div>
        <p class="eyebrow">MY DAILY EVENT WORKSPACE</p>

        <div class="title-line">
          <h1 id="workbenchTitle">每日事件工作台</h1>

          <button

            id="settingsButton"
            title="工作台设置"

<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-.7 2.2-2 .9-2.1-.5-1.5 2.6 1.5 1.7-.2 2.2L2.5 14 4 16.6l2.2-.4 1.8 1.3.5 2.5h3l1-2.2 2.2-.7 2.1.5 1.5-2.6-1.4-1.8.2-2.2 1.5-1.8-1.5-2.6-2.3.5-1.8-1.3-.5-2.5z" transform="translate(1 0)"/><circle cx="12" cy="11.5" r="3"/></svg>
          </button>

        <p class="subtitle" id="workbenchSubtitle">

    </header>

<div id="saveStatus" class="save-status" role="status" aria-live="polite" hidden><div id="saveStatusText"></div><button type="button" class="secondary-button" id="retrySave">重试保存 / 读取</button><button type="button" class="secondary-button" id="keepLocalChanges" hidden>相同内容保留本窗口修改</button><button type="button" class="secondary-button" id="loadOtherChanges" hidden>放弃未保存修改并加载最新</button></div>
    <p class="mobile-plan-caption" id="planningHint">拖动 ⠿ 安排日期 / 移回待办；滑动卡片浏览。</p>
    <main class="layout">
      <section class="panel date-panel" id="schedulePanel">
        <div class="panel-header">

    </main><button type="button" class="mobile-create" id="mobileCreateButton"><span aria-hidden="true">＋</span>新增事件</button>
  </div>

<dialog id="eventActionsDialog" class="event-actions-dialog" aria-labelledby="eventActionsTitle"><header class="event-actions-heading"><div><h2 id="eventActionsTitle">事件操作</h2><p id="eventActionsLocation"></p></div><button type="button" class="event-actions-close" id="eventActionsClose" aria-label="关闭操作菜单">×</button></header><div class="event-actions-options"><button type="button" id="eventActionsEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6zM14 5l5 5"/></svg>编辑事件</button><button type="button" id="eventActionsDelete" class="action-delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>删除事件</button></div></dialog>
<dialog id="mobileEditor" class="mobile-editor" aria-labelledby="mobileEditorTitle"><header class="mobile-editor-heading"><div><h2 id="mobileEditorTitle">新增事件</h2><p id="mobileEditorHint">安排日期、记录想法，按自己的节奏来。</p></div><button type="button" id="mobileEditorClose" class="mobile-editor-close" aria-label="关闭编辑">×</button></header><div id="mobileEditorWarning" class="mobile-editor-warning" role="status" hidden></div></dialog>
  <div class="modal-layer" id="largeCalendarModal">

        <span class="calendar-weekday">星期三</span>

  <div class="modal-layer" id="settingsModal">
    <div class="modal settings-modal">
      <div class="modal-header">
        <h2 class="modal-title">工作台设置</h2>

        <button
          class="close-button"
          data-close-modal="settingsModal"

        </button>
      </div>

      <form id="settingsForm">
        <div class="event-form">
          <div class="form-group full">
            <label class="form-label" for="settingsTitle">

            </label>

            <input id="settingsTitle" required />
          </div>

          <div class="form-group full">
            <label class="form-label" for="settingsSubtitle">
              工作台说明
            </label>

            <textarea
              id="settingsSubtitle"
              required
            ></textarea>
          </div>

          <div class="form-group full">
            <label class="form-label" for="primaryColor">

            </label>

            <div class="color-line">

              ></span>
            </div>

            </label>

                id="secondaryColorValue"

            </div>

          <div class="form-group full">

            </label>

          <div class="form-actions">

  <script>

    const STORAGE_KEY = "daily_event_workbench_github_share_v1";

    const weekdays = [
      "星期日",
      "星期一",
      "星期二",
      "星期三",
      "星期四",
      "星期五",
      "星期六"
    ];

    const defaultState = {
      events: [],
      inboxOrder: [],
      dayOrders: {},
      settings: {
        title: "每日事件工作台",
        subtitle:
          "把事件拖到对应日期，按照每天的节奏安排和完成任务。",
        primaryColor: "#E88EA8",
        secondaryColor: "#CBBFF0",
        backgroundColor: "#FFFAF7"
      }
    };

    const CHANGE_PREFIX = STORAGE_KEY + ":change:";
    const persistence = {
      base: null, clock: 0, dirty: false, error: "", conflict: false,
      pendingRecord: null, pendingView: null, seenConflictClock: 0, notice: ""
    };
    let editingSnapshot = null;
    let settingsSnapshot = null;
    let eventIndex = new Map();
    let orderedDays = new Map();
    let dayCounts = new Map();
    let inboxEvents = [];


    let state = loadState();


const equal=sameValue;
let pendingDateAnchor=null, historyLoading=false, historyLastTop=0, historyPull=null;
let actionEventId=null, actionTrigger=null;
    let visibleStart = addDays(startOfDay(new Date()), isMobileLayout() ? -7 : 0);
    let visibleEnd = addDays(startOfDay(new Date()), isMobileLayout() ? 6 : 90);
    if(isMobileLayout())pendingDateAnchor=dateKey(new Date());

    let largeCalendarMonth = new Date(
      visibleStart.getFullYear(),
      visibleStart.getMonth(),
      1
    );

    let firstRender = true;

    function sameValue(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }

    function normalizeData(value) {
      const defaults = structuredClone(defaultState);
      const data = value && typeof value === "object" ? value : {};
      return {
        events: Array.isArray(data.events) ? data.events.filter(event =>
          event && typeof event.id === "string" && typeof event.title === "string"
        ).map(event => ({...event, alertCount: Number(event.alertCount || 0)})) : [],
        inboxOrder: Array.isArray(data.inboxOrder) ? data.inboxOrder : [],
        dayOrders: data.dayOrders && typeof data.dayOrders === "object" ? data.dayOrders : {},
        settings: {...defaults.settings, ...(data.settings || {})}
      };
    }

    function makeChanges(before, after) {
      const changes = {events: [], settings: {}, dayOrders: {}, inboxOrder: null};
      const oldEvents = new Map(before.events.map(event => [event.id, event]));
      const newEvents = new Map(after.events.map(event => [event.id, event]));
      for (const [id, event] of oldEvents) {
        if (!newEvents.has(id)) changes.events.push({id, deleted: true, before: event});
      }
      for (const [id, event] of newEvents) {
        const old = oldEvents.get(id);
        if (!old) { changes.events.push({id, created: true, value: event}); continue; }
        const fields = {};
        for (const key of new Set([...Object.keys(old), ...Object.keys(event)])) {
          if (!sameValue(old[key], event[key])) fields[key] = {before: old[key] ?? null, value: event[key] ?? null};
        }
        if (Object.keys(fields).length) changes.events.push({id, fields});
      }
      for (const key of Object.keys(after.settings)) {
        if (!sameValue(before.settings[key], after.settings[key])) {
          changes.settings[key] = {before: before.settings[key], value: after.settings[key]};
        }
      }
      for (const key of new Set([...Object.keys(before.dayOrders), ...Object.keys(after.dayOrders)])) {
        if (!sameValue(before.dayOrders[key] || [], after.dayOrders[key] || [])) changes.dayOrders[key] = after.dayOrders[key] || [];
      }
      if (!sameValue(before.inboxOrder, after.inboxOrder)) changes.inboxOrder = after.inboxOrder;
      return changes;
    }

    function hasChanges(changes) {
      return changes.events.length || Object.keys(changes.settings).length ||
        Object.keys(changes.dayOrders).length || changes.inboxOrder !== null;
    }

    function applyChanges(data, changes, eventMap) {
      const events = eventMap || new Map(data.events.map(event => [event.id, event]));
      for (const change of changes.events) {
        if (change.deleted) events.delete(change.id);
        else if (change.created) events.set(change.id, structuredClone(change.value));
        else if (events.has(change.id)) {
          const event = events.get(change.id);
          for (const [key, field] of Object.entries(change.fields)) event[key] = field.value;
        }
      }
      if (!eventMap) data.events = [...events.values()];
      for (const [key, field] of Object.entries(changes.settings)) data.settings[key] = field.value;
      for (const [key, order] of Object.entries(changes.dayOrders)) data.dayOrders[key] = [...order];
      if (changes.inboxOrder !== null) data.inboxOrder = [...changes.inboxOrder];
    }

    function changesConflict(changes, remote, eventMap) {
      const events = eventMap || new Map(remote.events.map(event => [event.id, event]));
      for (const change of changes.events) {
        const current = events.get(change.id);
        if (change.deleted) { if (current && !sameValue(current, change.before)) return true; }
        else if (change.created) { if (current && !sameValue(current, change.value)) return true; }
        else {
          if (!current) return true;
          for (const [key, field] of Object.entries(change.fields)) {
            const value = current[key] ?? null;
            if (!sameValue(value, field.before) && !sameValue(value, field.value)) return true;
          }
        }
      }
      return Object.entries(changes.settings).some(([key, field]) =>
        !sameValue(remote.settings[key], field.before) && !sameValue(remote.settings[key], field.value)
      );
    }

    function readStoredState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = normalizeData(raw ? JSON.parse(raw) : null);
      const records = [];
      for (let index = 0; index < localStorage.length; index++) {
        const key = localStorage.key(index);
        if (!key || !key.startsWith(CHANGE_PREFIX)) continue;
        const value = localStorage.getItem(key);
        if (value) {
          const record = JSON.parse(value);
          if (record.version !== 1 || !Number.isSafeInteger(record.clock) || !record.id || !record.changes) throw Error("Invalid local changes");
          records.push(record);
        }
      }
      records.sort((a, b) => a.clock - b.clock || a.id.localeCompare(b.id));
      let conflictClock = 0;
      const events = new Map(data.events.map(event => [event.id, event]));
      for (const record of records) {
        if (changesConflict(record.changes, data, events)) conflictClock = record.clock;
        applyChanges(data, record.changes, events);
      }
      data.events = [...events.values()];
      normalizeOrderData(data);
      return {state: data, clock: records.at(-1)?.clock || 0, conflictClock};
    }

    function loadState() {
      try {
        const stored = readStoredState();
        persistence.base = structuredClone(stored.state);
        persistence.clock = stored.clock;
        persistence.seenConflictClock = stored.conflictClock;
        return stored.state;
      } catch (error) {
        persistence.error = "无法读取本地数据。请检查浏览器存储权限；恢复前不会覆盖原数据。";
        persistence.base = structuredClone(defaultState);
        return structuredClone(defaultState);
      }
    }

    function recordId() {
      return globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + "-" + Math.random().toString(36).slice(2);
    }

    function saveState(options = {}) {
      try {
        // A successful setItem followed by a failed read must not duplicate an edit.
        if (persistence.pendingRecord) {
          const key = CHANGE_PREFIX + persistence.pendingRecord.id;
          if (!localStorage.getItem(key)) localStorage.setItem(key, JSON.stringify(persistence.pendingRecord));
          const extra = makeChanges(persistence.pendingView, state);
          const stored = readStoredState();
          state = stored.state;
          persistence.base = structuredClone(state);
          if (hasChanges(extra)) applyChanges(state, extra);
          persistence.clock = stored.clock;
          persistence.pendingRecord = null;
          persistence.pendingView = null;
          persistence.dirty = !!hasChanges(extra);
          persistence.error = "";

        persistence.clock = merged.clock;
        persistence.pendingRecord = null;
        persistence.pendingView = null;

    function updateSaveStatus() {

    function refreshOtherWindows() {
      if (touchDrag?.active || persistence.dirty || persistence.pendingRecord) return;
      try {
        const stored = readStoredState();
        if (!sameValue(stored.state, persistence.base)) {
          state = stored.state;
          persistence.base = structuredClone(state);
          persistence.clock = stored.clock;
          persistence.error = "";
          persistence.notice = stored.conflictClock > persistence.seenConflictClock
            ? "其他窗口更新了相同内容，请核对当前显示结果。"

      }

    function startOfDay(value) {
      const date = new Date(value);

      return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );
    }

    function addDays(value, amount) {
      const date = startOfDay(value);
      date.setDate(date.getDate() + amount);
      return date;
    }

    function dateKey(value) {
      const date = startOfDay(value);

      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function dateFromKey(key) {
      const [year, month, day] = key
        .split("-")
        .map(Number);

      return new Date(year, month - 1, day);
    }

    function isToday(key) {
      return key === dateKey(new Date());
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

      if (count === 1) {
        return "❗";
      }

      return "";
    }

    function getAlertLabel(alertCount) {
      const count = Number(alertCount || 0);

      if (count === 3) {
        return "十分紧急";
      }

      if (count === 1) {
        return "紧急";
      }

      return "";
    }

      const orders = {};
      const seenDays = new Map();
      for (const [date, ids] of Object.entries(data.dayOrders)) {
        const seen = new Set();
        const valid = [];
        for (const id of Array.isArray(ids) ? ids : []) {
          if (byId.get(id)?.date === date && !seen.has(id)) { seen.add(id); valid.push(id); }
        }
        if (valid.length) { orders[date] = valid; seenDays.set(date, seen); }
      }
      for (const event of data.events) {
        if (!event.date) {
          if (!seenInbox.has(event.id)) {seenInbox.add(event.id); inboxIds.push(event.id);}
        } else {
          if (!orders[event.date]) {orders[event.date] = []; seenDays.set(event.date, new Set());}
          if (!seenDays.get(event.date).has(event.id)) {
            seenDays.get(event.date).add(event.id); orders[event.date].push(event.id);
          }
        }
      }
      data.inboxOrder = inboxIds;
      data.dayOrders = orders;
      const days = new Map();
      const counts = new Map();
      for (const [date, ids] of Object.entries(orders)) {
        const todo = [], done = [];
        for (const id of ids) {
          const event = byId.get(id);
          (event.status === "done" ? done : todo).push(event);
        }
        days.set(date, [...todo, ...done]);
        counts.set(date, {total: ids.length, done: done.length, todo: todo.length});
      }
      return {byId, days, counts, inbox: inboxIds.map(id => byId.get(id))};
    }

    function normalizeOrders() {
      const index = normalizeOrderData(state);
      eventIndex = index.byId;
      orderedDays = index.days;
      dayCounts = index.counts;
      inboxEvents = index.inbox;
    }

    function hexToRgb(hex) {
      const value = String(hex || "")
        .replace("#", "")
        .trim();

      if (!/^[0-9a-fA-F]{6}$/.test(value)) {
        return null;
      }

      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function rgbToHex(r, g, b) {
      return (
        "#" +
        [r, g, b]
          .map(value =>
            value.toString(16).padStart(2, "0")
          )
          .join("")
          .toUpperCase()
      );
    }

    function mixColor(firstColor, secondColor, amount) {
      const first = hexToRgb(firstColor);
      const second = hexToRgb(secondColor);

      if (!first || !second) {
        return "#FFF0F4";
      }

      return rgbToHex(
        Math.round(
          first.r + (second.r - first.r) * amount
        ),
        Math.round(
          first.g + (second.g - first.g) * amount
        ),
        Math.round(
          first.b + (second.b - first.b) * amount
        )
      );
    }

    function removeEventFromAllOrders(eventId) {
      state.inboxOrder = state.inboxOrder.filter(
        id => id !== eventId
      );

      Object.keys(state.dayOrders).forEach(key => {
        state.dayOrders[key] =
          state.dayOrders[key].filter(
            id => id !== eventId
          );
      });
    }

    function insertEventIntoDay(
      eventId,
      targetDate,
      targetIndex
    ) {
      const event = getEvent(eventId);

      if (!event || !targetDate) {
        return;
      }

      const oldDate = event.date;

      removeEventFromAllOrders(eventId);

      const existingEvents =
        getOrderedDayEvents(targetDate).filter(
          item => item.id !== eventId
        );

      const unfinished = existingEvents.filter(
        item => item.status !== "done"
      );

      const completed = existingEvents.filter(
        item => item.status === "done"
      );

      let index = Number(targetIndex);

      if (Number.isNaN(index)) {
        index = existingEvents.length;
      }

      if (event.status === "done") {
        const completedIndex = Math.max(
          0,
          Math.min(
            completed.length,
            index - unfinished.length
          )
        );

        completed.splice(completedIndex, 0, event);
      } else {
        const unfinishedIndex = Math.max(
          0,
          Math.min(index, unfinished.length)
        );

        unfinished.splice(unfinishedIndex, 0, event);
      }

      event.date = targetDate;

      state.dayOrders[targetDate] = [
        ...unfinished,
        ...completed
      ].map(item => item.id);

      if (
        oldDate &&
        oldDate !== targetDate &&
        state.dayOrders[oldDate]
      ) {
        state.dayOrders[oldDate] =
          state.dayOrders[oldDate].filter(
            id => id !== eventId
          );
      }

      normalizeOrders();
    }

    function moveEventToInbox(eventId, targetIndex) {
      const event = getEvent(eventId);

      if (!event) {
        return;
      }

      removeEventFromAllOrders(eventId);

      event.date = null;

      const inboxIds = getInboxEvents()
        .filter(item => item.id !== eventId)
        .map(item => item.id);

      let index = Number(targetIndex);

      if (Number.isNaN(index)) {
        index = inboxIds.length;
      }

      index = Math.max(
        0,
        Math.min(index, inboxIds.length)
      );

      inboxIds.splice(index, 0, eventId);

      state.inboxOrder = inboxIds;

      normalizeOrders();
    }

    function toggleEvent(eventId, completed) {
      const event = getEvent(eventId);

      if (!event) {
        return;
      }

      const wasCompleted =
        event.status === "done";

      event.status = completed ? "done" : "todo";

      event.completedAt = completed
        ? new Date().toISOString()
        : null;

      if (!wasCompleted && completed) {
        celebrate();
      }

      normalizeOrders();
      renderAll();
    }

    function saveEventFromForm() {
      const editingId =
        document.getElementById(
          "editingEventId"
        ).value;

      const title =
        document.getElementById(
          "eventTitle"
        ).value.trim();

      if (!title) {
        alert("请输入事件名称。");
        return;
      }

      const status =
        document.getElementById(
          "eventStatus"
        ).value;

      let date =
        document.getElementById(
          "eventDate"
        ).value || null;

      const color =
        document.getElementById(
          "eventColor"
        ).value || "#FFFFFF";

      const alertCount = Number(
        document.getElementById(
          "eventAlert"
        ).value
      );

      const notes =
        document.getElementById(
          "eventNotes"
        ).value.trim();

      if (editingId) {
        const event = getEvent(editingId);

        if (!event) {
          return;
        }

        const oldStatus = event.status;
        const oldDate = event.date;

        const fields = {title, status, color: color.toUpperCase(),
          alertCount: alertCount === 1 || alertCount === 3 ? alertCount : 0, notes};
        for (const [key, value] of Object.entries(fields)) {
          if (!editingSnapshot || !equal(editingSnapshot[key], value)) event[key] = value;
        }
        if (editingSnapshot && date === (editingSnapshot.date || null)) date = oldDate;
        event.date = oldDate;

        event.completedAt =
          event.status === "done"
            ? event.completedAt ||
              new Date().toISOString()
            : null;

        if (
          oldStatus !== "done" &&
          event.status === "done"
        ) {
          celebrate();
        }

        if (oldDate !== date) {
          if (date) {
            insertEventIntoDay(
              event.id,
              date,
              0
            );
          } else {
            moveEventToInbox(
              event.id,
              getInboxEvents().length
            );
          }
        } else {
          event.date = date;
          normalizeOrders();
        }
      } else {
        const event = {
          id:
            "event-" +
            Date.now() +
            "-" +
            Math.random()
              .toString(16)
              .slice(2),
          title,
          status,
          date: null,
          color: color.toUpperCase(),
          alertCount:
            alertCount === 1 || alertCount === 3
              ? alertCount
              : 0,
          notes,
          createdAt: new Date().toISOString(),
          completedAt:
            status === "done"
              ? new Date().toISOString()
              : null
        };

        state.events.push(event);
        document.getElementById("editingEventId").value = event.id;
        editingSnapshot = structuredClone(event);
        normalizeOrders();

        if (date) {
          insertEventIntoDay(
            event.id,
            date,
            0
          );
        } else {
          state.inboxOrder.push(event.id);
        }

        if (status === "done") {
          celebrate();
        }
      }

      if (renderAll()) {
        clearEventForm();
        if (isMobileLayout()) {
          closeMobileEditor(true);
          if (date) jumpToDate(date, {smooth:false}); else setMobileView('inbox');
        }
      }
    }

    function celebrate() {
      const colors = [
        state.settings.primaryColor,
        state.settings.secondaryColor,
        "#F8DFA1",
        "#B8E5CA",
        "#A9D9EF",
        "#F7C69D"
      ];

      for (let index = 0; index < 90; index += 1) {
        const piece =
          document.createElement("span");

        piece.className = "confetti";

        piece.style.left =
          `${Math.random() * 100}vw`;

        piece.style.top =
          `${Math.random() * 18 + 4}vh`;

        piece.style.background =
          colors[
            Math.floor(
              Math.random() * colors.length
            )
          ];

        piece.style.setProperty(
          "--x",
          `${(Math.random() - 0.5) * 520}px`
        );

        piece.style.setProperty(
          "--y",
          `${Math.random() * 520 + 220}px`
        );

        piece.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 1500);
      }
    }

function jumpToDate(key, options = {}) {
  const date = dateFromKey(key);
  if(isMobileLayout()) {
    visibleStart=addDays(date,-7);visibleEnd=addDays(date,6);pendingDateAnchor=key;
    setMobileView('schedule',false);renderDateStream({keepScroll:false});updateDateRangeHint();
    requestAnimationFrame(()=>scrollMobileDateTo(key,options.smooth===false?'auto':'smooth'));
    return;
  }
  const container =
    document.getElementById("dateStream");

  if (date < visibleStart) {
    visibleStart = addDays(date, -10);
  }

  if (date > visibleEnd) {
    visibleEnd = addDays(date, 60);
  }

  renderDateStream({
    keepScroll: false
  });

  requestAnimationFrame(() => {
    const target = document.querySelector(
      `[data-day-card="${key}"]`
    );

    if (!target) {
      return;
    }

    const containerRect =
      container.getBoundingClientRect();

    const targetRect =
      target.getBoundingClientRect();

    const targetTop =
      targetRect.top -
      containerRect.top +
      container.scrollTop;

    container.scrollTo({
      top: Math.max(0, targetTop - 2),
      behavior:
        options.smooth === false
          ? "auto"
          : "smooth"
    });

    requestAnimationFrame(() => {
      updateCurrentMonthLabel();
    });
  });
}

    function updateColorValues() {
      const pairs = [
        ["primaryColor", "primaryColorValue"],
        ["secondaryColor", "secondaryColorValue"],
        ["backgroundColor", "backgroundColorValue"]
      ];

      pairs.forEach(([inputId, outputId]) => {
        const input =
          document.getElementById(inputId);

        const output =
          document.getElementById(outputId);

        if (input && output) {
          output.textContent =
            input.value.toUpperCase();
        }
      });
    }

    function openSettings() {
      settingsSnapshot = clone(state.settings);
      document.getElementById(
        "settingsTitle"
      ).value = state.settings.title;

      document.getElementById(
        "settingsSubtitle"
      ).value = state.settings.subtitle;

      document.getElementById(
        "primaryColor"
      ).value = state.settings.primaryColor;

      document.getElementById(
        "secondaryColor"
      ).value = state.settings.secondaryColor;

      document.getElementById(
        "backgroundColor"
      ).value = state.settings.backgroundColor;

      updateColorValues();
      openModal("settingsModal");
    }

    function setupDragAndDrop() {
      document.addEventListener(
        "dragstart",
        event => {
          const card =
            event.target.closest(
              "[data-event-card]"
            );

          if (!card) {
            return;
          }

          if(touchDrag?.active){event.preventDefault();return;}
          event.dataTransfer.effectAllowed =
            "move";

          event.dataTransfer.setData(
            "text/plain",
            card.dataset.eventCard
          );

          card.classList.add("dragging");
        }
      );

      document.addEventListener(
        "dragend",
        event => {
          const card =
            event.target.closest(
              "[data-event-card]"
            );

          if (card) {
            card.classList.remove("dragging");
          }

          document
            .querySelectorAll(".drag-over")
            .forEach(element => {
              element.classList.remove(
                "drag-over"
              );
            });
        }
      );

      document.addEventListener(
        "dragover",
        event => {
          const zone =
            event.target.closest(
              ".drop-slot, #inboxList"
            );

          if (!zone) {
            return;
          }

          event.preventDefault();
          zone.classList.add("drag-over");
        }
      );

      document.addEventListener(
        "dragleave",
        event => {
          const zone =
            event.target.closest(
              ".drop-slot, #inboxList"
            );

          if (zone) {
            zone.classList.remove(
              "drag-over"
            );
          }
        }
      );

      document.addEventListener(
        "drop",
        event => {
          const eventId =
            event.dataTransfer.getData(
              "text/plain"
            );

          if (!eventId) {
            return;
          }

          const slot =
            event.target.closest(
              ".drop-slot"
            );

          if (slot) {
            event.preventDefault();

            insertEventIntoDay(
              eventId,
              slot.dataset.date,
              Number(
                slot.dataset.slotIndex
              )
            );

            renderAll();
            return;
          }

          const inbox =
            event.target.closest(
              "#inboxList"
            );

          if (inbox) {
            event.preventDefault();

            const targetCard =
              event.target.closest(
                "[data-event-card]"
              );

            const inboxEvents =
              getInboxEvents();

            let targetIndex =
              inboxEvents.length;

            if (targetCard) {
              const targetId =
                targetCard.dataset.eventCard;

              const foundIndex =
                inboxEvents.findIndex(
                  item => item.id === targetId
                );

              if (foundIndex >= 0) {
                targetIndex = foundIndex;
              }
            }

            moveEventToInbox(
              eventId,
              targetIndex
            );

            renderAll();
          }
        }
      );
    }

    document
      .getElementById("eventForm")
      .addEventListener(
        "submit",
        event => {
          event.preventDefault();
          saveEventFromForm();
        }
      );

    document
      .getElementById("newEventButton")
      .addEventListener(
        "click",
        () => {
          clearEventForm();
          focusEventForm();
        }
      );

    document
      .getElementById("clearFormButton")
      .addEventListener(
        "click",
        clearEventForm
      );

    document
      .getElementById("todayButton")
      .addEventListener(
        "click",
        () => {
          const today =
            startOfDay(new Date());

          const key = dateKey(today);

          visibleStart = isMobileLayout() ? addDays(today,-7) : today;
          if(isMobileLayout())pendingDateAnchor=key;
          visibleEnd =
            addDays(today, isMobileLayout() ? 6 : 90);

          largeCalendarMonth =
            new Date(
              today.getFullYear(),
              today.getMonth(),
              1
            );

  renderAll({
  keepScroll: false
});

requestAnimationFrame(() => {
  const dateStream =
    document.getElementById("dateStream");

  if(isMobileLayout())scrollMobileDateTo(key);
  else dateStream.scrollTo({top:0,behavior:"auto"});

  updateCurrentMonthLabel();
  if(isMobileLayout()){setMobileView('schedule',false);window.scrollTo({top:0,behavior:'smooth'});}
});

        }
      );

    document
      .getElementById("largeCalendarButton")
      .addEventListener(
        "click",
        () => {
          const today =
            startOfDay(new Date());

          largeCalendarMonth =
            new Date(
              today.getFullYear(),
              today.getMonth(),
              1
            );

          renderLargeCalendar();
          openModal(
            "largeCalendarModal"
          );
        }
      );

    document
      .getElementById("settingsButton")
      .addEventListener(
        "click",
        openSettings
      );

    document
      .getElementById("settingsForm")
      .addEventListener(
        "submit",
        event => {
          event.preventDefault();

          const title =
            document
              .getElementById(
                "settingsTitle"
              )
              .value.trim();

          const subtitle =
            document
              .getElementById(
                "settingsSubtitle"
              )
              .value.trim();

          if (!title || !subtitle) {
            return;
          }

          const edited = {
            title, subtitle,
            primaryColor: document.getElementById("primaryColor").value.toUpperCase(),
            secondaryColor: document.getElementById("secondaryColor").value.toUpperCase(),
            backgroundColor: document.getElementById("backgroundColor").value.toUpperCase()
          };
          for (const [key, value] of Object.entries(edited)) {
            if (!settingsSnapshot || !equal(settingsSnapshot[key], value)) state.settings[key] = value;
          }
          if (!renderAll()) return;
          closeModal("settingsModal");
        }
      );

    [
      "primaryColor",
      "secondaryColor",
      "backgroundColor"
    ].forEach(id => {
      document
        .getElementById(id)
        .addEventListener(
          "input",
          updateColorValues
        );
    });

    document.addEventListener(
      "click",
      event => {
        const editButton =
          event.target.closest(
            "[data-edit-event]"
          );

        if (editButton) {
          editEvent(
            editButton.dataset.editEvent
          );
          return;
        }

        const deleteButton =
          event.target.closest(
            "[data-delete-event]"
          );

        if (deleteButton) {
          deleteEvent(
            deleteButton.dataset.deleteEvent
          );
          return;
        }

        const calendarDate =
          event.target.closest(
            "[data-calendar-date]"
          );

        if (calendarDate) {
          closeModal(
            "largeCalendarModal"
          );

          jumpToDate(
            calendarDate.dataset.calendarDate
          );

          return;
        }

        const calendarStep =
          event.target.closest(
            "[data-calendar-step]"
          );

        if (calendarStep) {
          const step = Number(
            calendarStep.dataset.calendarStep
          );

          largeCalendarMonth =
            new Date(
              largeCalendarMonth.getFullYear(),
              largeCalendarMonth.getMonth() + step,
              1
            );

          renderLargeCalendar();
          return;
        }

        const closeButton =
          event.target.closest(
            "[data-close-modal]"
          );

        if (closeButton) {
          closeModal(
            closeButton.dataset.closeModal
          );
        }
      }
    );

    document.addEventListener(
      "change",
      event => {
        const checkbox =
          event.target.closest(
            "[data-event-check]"
          );

        if (!checkbox) {
          return;
        }

        toggleEvent(
          checkbox.dataset.eventCheck,
          checkbox.checked
        );
      }
    );

    document
      .querySelectorAll(".modal-layer")
      .forEach(layer => {
        layer.addEventListener(
          "click",
          event => {
            if (event.target === layer) {
              closeModal(layer.id);
            }
          }
        );
      });

    document.addEventListener(
      "keydown",
      event => {
        if (event.key !== "Escape") {
          return;
        }

        document
          .querySelectorAll(
            ".modal-layer.show"
          )
          .forEach(modal => {
            closeModal(modal.id);
          });
      }
    );

    document
      .getElementById("dateStream")
      .addEventListener(
        "scroll",
        event => {
          if(isMobileLayout()) return;
          const container =
            event.currentTarget;

          updateCurrentMonthLabel();

          if (
            container.scrollTop +
              container.clientHeight >=
            container.scrollHeight - 260
          ) {
            visibleEnd =
              addDays(visibleEnd, 60);

            renderDateStream({
              keepScroll: true
            });

            updateDateRangeHint();
          }

          if (
            container.scrollTop <= 30 &&
            visibleStart >
              addDays(
                startOfDay(new Date()),
                -30
              )
          ) {
            const oldHeight =
              container.scrollHeight;

            visibleStart =
              addDays(visibleStart, -30);

            renderDateStream({
              keepScroll: false
            });

            requestAnimationFrame(() => {
              container.scrollTop =
                container.scrollHeight -
                oldHeight;

              updateCurrentMonthLabel();
              updateDateRangeHint();
            });
          }
        }
      );


initializeMobileUI();initializeTouchPlanning();initializeDateHistory();initializeEventActions();
    document.getElementById("retrySave").addEventListener("click", () => {
      persistence.notice = "";
      if (persistence.dirty) renderAll();
      else {
        try {
          const stored = readStoredState();
          state = stored.state;
          persistence.base = structuredClone(state);
          persistence.error = "";
          renderAll({persist: false});
        } catch (error) { persistence.error = "仍然无法读取本地数据，请检查浏览器存储权限。"; updateSaveStatus(); }
      }
    });
    document.getElementById("keepLocalChanges").addEventListener("click", () => {
      if (saveState({force: true})) renderAll({persist: false});
    });
    document.getElementById("loadOtherChanges").addEventListener("click", () => {
      if (!confirm("放弃本窗口尚未保存的修改，加载其他窗口的最新数据？")) return;
      try {
        const stored = readStoredState();
        state = stored.state;
        persistence.base = structuredClone(state);
        persistence.dirty = false;
        persistence.conflict = false;
        persistence.error = "";
        clearEventForm();
        renderAll({persist: false});
      } catch (error) { persistence.error = "无法读取最新数据，当前修改仍保留在本窗口。"; updateSaveStatus(); }
    });
    let storageRefreshTimer;
    window.addEventListener("storage", event => {
      if (event.key === null || event.key === STORAGE_KEY || event.key.startsWith(CHANGE_PREFIX)) {
        clearTimeout(storageRefreshTimer);
        storageRefreshTimer = setTimeout(refreshOtherWindows, 40);
      }
    });
    window.addEventListener("focus", refreshOtherWindows);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") refreshOtherWindows();
    });
    window.addEventListener("beforeunload", event => {
      if (persistence.dirty || persistence.pendingRecord) { event.preventDefault(); event.returnValue = ""; }
    });

function downloadState(value,name) {
 const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById('exportData').onclick=()=>downloadState(state,'每日事件备份-'+dateKey(new Date())+'.json');
document.getElementById('importData').onchange=async e=>{
 try {const incoming=JSON.parse(await e.target.files[0].text());
 if(!Array.isArray(incoming.events)||!incoming.settings||incoming.events.some(x=>!x||typeof x.id!=='string'||typeof x.title!=='string'))throw Error();
 if(!confirm('导入会替换当前工作台。建议先导出备份，是否继续？'))return;
 state=normalizeData(incoming);clearEventForm();renderAll();
 }catch{alert('无法读取备份，请选择每日事件的 JSON 备份文件。');}finally{e.target.value='';}
};

setupDragAndDrop();applySettings();renderAll({keepScroll:false});
</script>
